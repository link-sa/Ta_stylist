<style>
/* Layout: soft shaded ground, one white card; rose band on top with the round logo overlapping it, centered pill buttons, small icon row, thin rose strip at the card's foot. */
:root {
  --bg: #efe4de;
  --shade: rgba(110, 67, 51, 0.055);
  --card: #fffaf7;
  --pill: #f3e5de;
  --fg: #6e4333;
  --muted: #8f6f62;
  --accent: #c9977f;
  --line: #ecd3c8;
  --band-a: #e6c9bb;
  --band-b: #f8e8e0;
  --primary-bg: #6e4333;
  --primary-fg: #fff0eb;
  --shadow: 0 10px 30px rgba(110, 67, 51, 0.14);
  --font-display: "Amiri", "Noto Naskh Arabic", Georgia, serif;
  --font-body: "Tajawal", "Segoe UI", Tahoma, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #120d0c; --shade: rgba(255, 255, 255, 0.03); --card: #1e1614; --pill: #2b201d;
    --fg: #f3e1d8; --muted: #b99f94; --accent: #d9ab94; --line: #3a2d29;
    --band-a: #43302a; --band-b: #2a1e1b; --primary-bg: #d9ab94; --primary-fg: #3b2219;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #120d0c; --shade: rgba(255, 255, 255, 0.03); --card: #1e1614; --pill: #2b201d;
  --fg: #f3e1d8; --muted: #b99f94; --accent: #d9ab94; --line: #3a2d29;
  --band-a: #43302a; --band-b: #2a1e1b; --primary-bg: #d9ab94; --primary-fg: #3b2219;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(115deg, transparent 0 22%, var(--shade) 22% 36%, transparent 36% 52%, var(--shade) 52% 61%, transparent 61% 78%, var(--shade) 78% 84%, transparent 84%);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
.card {
  max-width: 400px; margin: 0 auto; background: var(--card);
  box-shadow: var(--shadow); border-bottom: 14px solid var(--pill);
  overflow: hidden;
}
.band {
  height: 150px;
  background:
    radial-gradient(circle at 18% 30%, var(--band-b) 0 26px, transparent 27px),
    radial-gradient(circle at 82% 70%, var(--band-b) 0 42px, transparent 43px),
    radial-gradient(circle at 60% 18%, var(--band-b) 0 14px, transparent 15px),
    linear-gradient(135deg, var(--band-a), var(--band-b));
}
.body { padding: 0 28px 28px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.logo {
  width: 156px; height: 156px; border-radius: 50%; display: block; margin-top: -78px;
  box-shadow: 0 0 0 6px var(--card), 0 6px 18px rgba(110, 67, 51, 0.16);
}
h1 { font-family: var(--font-display); font-weight: 700; font-size: 31px; line-height: 1.25; margin: 18px 0 0; text-wrap: balance; }
.sub { margin: 6px 0 0; font-size: 16px; font-weight: 500; text-wrap: balance; }
.tags { margin: 8px 0 0; color: var(--muted); font-size: 14px; text-wrap: balance; }
nav { align-self: stretch; display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
.pill {
  display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 10px 20px;
  border-radius: 999px; background: var(--pill); color: var(--fg); border: 1px solid transparent;
  font-weight: 700; font-size: 17px; text-decoration: none; letter-spacing: .02em;
  transition: transform .15s ease, border-color .15s ease;
}
.pill:hover { border-color: var(--accent); transform: translateY(-1px); }
.pill.primary { background: var(--primary-bg); color: var(--primary-fg); }
.pill:focus-visible, .ic:focus-visible, .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.phone { margin-top: 22px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 15px; }
.phone bdi { direction: ltr; font-variant-numeric: tabular-nums; letter-spacing: .04em; color: var(--fg); font-weight: 500; user-select: all; }
.copy { font: inherit; font-size: 14px; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 14px; cursor: pointer; }
.copy:hover { border-color: var(--accent); }
.icons { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
.ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--pill); color: var(--muted); transition: color .15s ease; }
.ic:hover { color: var(--fg); }
.ic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
@media (prefers-reduced-motion: reduce) { .pill, .ic { transition: none; } .pill:hover { transform: none; } }
</style>

<script>
(function () {
  var btn = document.getElementById('copy');
  var num = document.getElementById('num');
  btn.addEventListener('click', function () {
    var done = function () { btn.textContent = 'تم النسخ'; setTimeout(function () { btn.textContent = 'نسخ'; }, 1800); };
    var fallback = function () {
      try {
        var r = document.createRange(); r.selectNodeContents(num);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        btn.textContent = 'حدد الرقم';
      } catch (e) {}
    };
    try {
      navigator.clipboard.writeText(num.textContent.trim()).then(done, fallback);
    } catch (e) { fallback(); }
  });
})();
</script>
